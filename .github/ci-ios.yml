name: iOS

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BTCiOS
        run: |
          xcodebuild clean build \
            -workspace BTCPriceApp.xcworkspace \
            -scheme BTCiOS \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
