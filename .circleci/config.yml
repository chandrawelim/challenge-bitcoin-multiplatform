version: 2.1

jobs:
  test-btckit:
    macos:
      xcode: "16.2.0"
    steps:
      - checkout
      - run:
          name: Build and test BTCKit
          command: |
            xcodebuild clean build test \
              -project BTCKit/BTCKit.xcodeproj \
              -scheme BTCKit \
              -destination "platform=macOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              ONLY_ACTIVE_ARCH=YES

  build-cli:
    macos:
      xcode: "16.2.0"
    steps:
      - checkout
      - run:
          name: Build CLI
          command: swift build -c release --product CLI

workflows:
  version: 2
  ci:
    jobs:
      - test-btckit
      - build-cli