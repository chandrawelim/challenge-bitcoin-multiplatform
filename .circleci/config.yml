version: 2.1

jobs:
  test-btckit:
    docker:
      - image: swift:5.9
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: swift test --xunit-output test-results.xml
      - store_test_results:
          path: test-results.xml
      - store_artifacts:
          path: test-results.xml

  build-cli:
    docker:
      - image: swift:5.9
    steps:
      - checkout
      - run:
          name: Build CLI
          command: swift build -c release --product CLI

workflows:
  version: 2
  ci:
    jobs:
      - test-btckit
      - build-cli